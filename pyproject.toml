[project]
name = "hibiki-ewe"
version = "0.1.0"
description = "Ewe-to-English Hibiki-Zero speech translation: fine-tuning and CUDA inference on NVIDIA GB10."
requires-python = ">= 3.10,<3.14"
readme = "README.md"
dependencies = [
    "einops",
    "huggingface-hub>=1.33.0",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "moshi==0.2.13",
    "numpy",
    "safetensors",
    "sentencepiece",
    "sphn>=0.2.0",
    "torch>=2.14.1",
]

[project.optional-dependencies]
training = [
    "num2words",
    "sacrebleu",
    "soundfile",
    "transformers",
]

[tool.ruff]
line-length = 100

[tool.uv]
package = false
# moshi 0.2.13 pins old torch/huggingface-hub/numpy/safetensors; newer versions work.
override-dependencies = [
    "torch>=2.14.1",
    "huggingface-hub>=1.33.0",
    "numpy>=1.26",
    "safetensors>=0.4.0",
    "sounddevice>=0.5",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu130"
